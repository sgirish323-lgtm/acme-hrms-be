services:
    hrms-db:
        image: postgres:17.5-alpine
        container_name: hrms-db
        environment:
            POSTGRES_USER: dbUser
            POSTGRES_PASSWORD: dbPassword
            POSTGRES_DB: hrms-dev
        restart: always
        volumes:
            - pg_data:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        healthcheck:
            test: [ 'CMD-SHELL', 'pg_isready -U dbUser -d hrms-dev' ]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    pg_data:
